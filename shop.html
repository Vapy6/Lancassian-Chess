<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade</title>
<style>
:root{--bg:#0d0b09;--panel:#16120e;--panel2:#1d1812;--edge:#5b4630;--edge2:#8a6a3f;--gold:#dcb96c;--ink:#e8dfcb;--dim:#8f8575;--good:#7fc08a;--bad:#e0705f;--c0:#7d7566;--c1:#5fa36a;--c2:#5b8fd9;--c3:#a06bd6}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#241b12 0,#0d0b09 70%);color:var(--ink);font:14px/1.4 Georgia,'Palatino Linotype',serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--edge);padding-bottom:8px}
.top h1{margin:0;font:600 21px Georgia,serif;color:var(--gold);letter-spacing:.04em}.top .sub{color:var(--dim);font-size:12px}
.sp{flex:1}.x{background:none;border:1px solid var(--edge);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}.x:hover{border-color:var(--gold);color:var(--gold)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}.tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--dim);padding:5px 12px;cursor:pointer;font:600 12px Georgia,serif;letter-spacing:.1em;text-transform:uppercase}.tab.on{color:var(--gold);border-color:var(--gold)}.tab:hover{color:var(--ink)}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:1fr 290px 1fr;gap:10px}
.pane{background:linear-gradient(#1a1510,#120f0b);border:1px solid var(--edge);border-radius:4px;box-shadow:inset 0 0 0 1px #000,inset 0 0 24px rgba(0,0,0,.5);display:flex;flex-direction:column;min-height:0}
.ph{padding:8px 12px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:8px}.ph b{font:600 13px Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}.ph span{color:var(--dim);font-size:12px}
.grid{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,62px);gap:6px;align-content:start;overflow:auto;flex:1}
.tile{position:relative;width:62px;height:62px;border:2px solid var(--c0);border-radius:4px;background:radial-gradient(circle at 50% 35%,#2a2218,#15110c);cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.tile:hover{filter:brightness(1.35);box-shadow:0 0 0 1px var(--gold)}.tile.r1{border-color:var(--c1)}.tile.r2{border-color:var(--c2)}.tile.r3{border-color:var(--c3)}
.tile.off{opacity:.4;cursor:default}.tile.off:hover{filter:none;box-shadow:none}
.tile svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile .q{position:absolute;right:3px;bottom:1px;font:700 11px system-ui;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.tile .e{position:absolute;left:3px;top:1px;font:700 10px system-ui;color:var(--gold);text-shadow:0 0 3px #000}
.empty{color:var(--dim);padding:14px;font-style:italic}
.mid{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.mid h3{margin:0;font:600 11px Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;align-items:center;gap:6px;background:#0f0c09;border:1px solid #2c2219;border-radius:3px;padding:3px 6px;font-size:13px}.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .p{color:var(--gold);font-size:12px;white-space:nowrap}
.row button{background:none;border:1px solid var(--edge);color:var(--ink);border-radius:3px;cursor:pointer;width:22px;height:22px;line-height:1}.row button:hover{border-color:var(--bad);color:var(--bad)}
.sum{border-top:1px solid var(--edge);padding:10px 12px;display:flex;flex-direction:column;gap:6px}.sum .l{display:flex;justify-content:space-between;font-size:13px}.sum .l b{color:var(--gold);font-weight:600}
.go{background:linear-gradient(#8a6a3f,#5d4526);border:1px solid var(--gold);color:#fff3d6;padding:9px;border-radius:3px;cursor:pointer;font:700 13px Georgia,serif;letter-spacing:.14em;text-transform:uppercase}.go:hover{filter:brightness(1.15)}.go:disabled{opacity:.35;cursor:default;filter:none}
.ghost{background:none;border:1px solid var(--edge);color:var(--dim);padding:5px;border-radius:3px;cursor:pointer;font-size:12px}.ghost:hover{color:var(--ink);border-color:var(--edge2)}
#st{min-height:18px;font-size:12px;color:var(--dim)}#st.bad{color:var(--bad)}#st.ok{color:var(--good)}
#tip{position:fixed;z-index:9;display:none;max-width:270px;background:#0b0907f2;border:1px solid var(--edge2);border-radius:4px;padding:9px 11px;box-shadow:0 6px 20px #000c;pointer-events:none}
#tip h4{margin:0 0 2px;font:600 15px Georgia,serif}#tip .t{color:var(--dim);font-size:12px;margin-bottom:5px}#tip .w{color:var(--bad);font-size:12px;margin-top:4px}#tip .pr{margin-top:6px;padding-top:5px;border-top:1px solid #2c2219;font-size:12px;color:var(--gold)}
@media(max-width:860px){.cols{grid-template-columns:1fr;grid-template-rows:1fr auto 1fr;overflow:auto}body{overflow:auto}#app{height:auto;min-height:100%}.pane{min-height:210px}}
</style></head><body><div id="app"></div><div id="tip"></div>
<script src="dnd-data.js"></script><script src="dnd-rules.js"></script><script src="dnd-inventory.js"></script>
<script>
(function () {
  var I = window.DNDINV, DATA = window.DNDDATA, app = document.getElementById('app'), tip = document.getElementById('tip'), q = new URLSearchParams(location.search);
  var T = { town: q.get('town') || 'Travelling Market', role: q.get('role') || 'merchant', npc: q.get('npc') || 'The merchant', disp: Math.max(-3, Math.min(5, parseInt(q.get('disp') || '0', 10) || 0)) };
  var H = null, SH = null, buy = {}, sell = {}, tab = 'all', msg = '', msgc = '';
  var MOD = T.disp * 0.03, TABS = [['all', 'All'], ['weapons', 'Weapons'], ['armor', 'Armour'], ['consumables', 'Consumables'], ['magic', 'Magic'], ['gear', 'Gear']];
  // ---------- icons ----------
  var IC = {
    sword: '<path d="M25 7 L12 20 M9 17 L15 23 M12 20 L7 25"/><circle cx="6" cy="26" r="1.4"/>', axe: '<path d="M9 26 L22 8"/><path d="M17 11 Q24 3 28 10 Q24 17 20 15 Z"/>',
    hammer: '<path d="M10 27 L20 14"/><rect x="14" y="5" width="13" height="8" rx="1.5" transform="rotate(35 20 9)"/>', bow: '<path d="M10 4 Q29 16 10 28 Z"/><path d="M5 16 H22 M19 13 L22 16 L19 19"/>',
    spear: '<path d="M6 27 L23 9"/><path d="M26 6 L19 8 L24 13 Z"/>', shield: '<path d="M16 4 L26 8 V16 Q26 24 16 29 Q6 24 6 16 V8 Z"/><path d="M16 9 V24 M10 15 H22"/>',
    armor: '<path d="M10 5 L16 8 L22 5 L28 10 L24 14 V27 H8 V14 L4 10 Z"/><path d="M16 8 V27"/>', potion: '<path d="M13 4 H19 M14 4 V11 L8 23 Q8 28 12 28 H20 Q24 28 24 23 L18 11 V4"/><path d="M10 20 H22"/>',
    ring: '<circle cx="16" cy="20" r="8"/><path d="M12 9 L16 4 L20 9 L16 12 Z"/>', amulet: '<path d="M7 4 Q16 16 25 4"/><circle cx="16" cy="21" r="6"/><circle cx="16" cy="21" r="1.5"/>',
    bag: '<path d="M11 11 Q16 2 21 11"/><path d="M9 11 H23 L26 27 H6 Z"/><path d="M12 17 H20"/>', arrows: '<path d="M6 26 L26 6 M26 6 H20 M26 6 V12 M6 26 L4 21 M6 26 L11 28"/>', tool: '<circle cx="16" cy="16" r="9"/><path d="M16 7 V25 M7 16 H25"/>'
  };
  function iconKey(n) {
    if (DATA.ARMOR[n]) return n === 'Shield' ? 'shield' : 'armor'; var w = DATA.WEAPONS[n];
    if (w) return /axe|glaive|halberd/i.test(n) ? 'axe' : /hammer|mace|club|maul|flail|morningstar|war pick/i.test(n) ? 'hammer' : /bow|sling|dart|blowgun/i.test(n) ? 'bow' : /spear|javelin|lance|pike|trident|staff/i.test(n) ? 'spear' : 'sword';
    if (I.MAGIC[n]) return I.MAGIC[n].type; if (/arrow|bolt|dart/i.test(n)) return 'arrows'; if (/pack/i.test(n)) return 'bag'; if (/shield/i.test(n)) return 'shield'; return 'tool';
  }
  function icon(n) { return '<svg viewBox="0 0 32 32">' + IC[iconKey(n)] + '</svg>'; }
  function rarity(n) { var p = I.price(n) || 0; return I.MAGIC[n] && I.MAGIC[n].type !== 'potion' ? (p >= 600 ? 3 : 2) : p >= 700 ? 3 : p >= 150 ? 2 : p >= 40 ? 1 : 0; }
  var RC = ['#b5ad9d', '#7fc08a', '#7fa8ec', '#bf8ef0'];
  // ---------- money / prices ----------
  function fmt(cp) { cp = Math.round(cp); var g = Math.floor(cp / 100), s = Math.floor(cp / 10) % 10, c = cp % 10, o = []; if (g) o.push(g + ' gp'); if (s) o.push(s + ' sp'); if (c) o.push(c + ' cp'); return o.length ? o.join(' ') : '0 gp'; }
  function buyCp(n) { return Math.max(1, Math.round(I.priceCp(n) * (1 - MOD))); }
  function sellCp(n) { return Math.max(1, Math.floor(I.priceCp(n) * (0.5 + MOD / 2))); }
  function eqCount(n) { var c = 0; I.SLOTS.forEach(function (k) { if (H.equipped[k] === n) c++; }); return c; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // ---------- state ----------
  function shopKey() { return T.town + '|' + T.role; }
  function allShops() { try { return JSON.parse(localStorage.getItem('dnd.shops') || '{}'); } catch (e) { return {}; } }
  function load() {
    try { H = JSON.parse(localStorage.getItem('dnd.active') || 'null'); } catch (e) { H = null; } if (H) I.ensure(H);
    var all = allShops(); SH = all[shopKey()]; if (!SH) { SH = I.shopFor(T.town, T.role); all[shopKey()] = SH; try { localStorage.setItem('dnd.shops', JSON.stringify(all)); } catch (e) { } }
  }
  function saveShop() { var all = allShops(); all[shopKey()] = SH; try { localStorage.setItem('dnd.shops', JSON.stringify(all)); } catch (e) { } }
  function stockQty(n) { var x = SH.stock.filter(function (s) { return s.name === n; })[0]; return x ? x.qty : 0; }
  function mine() { return H.inventory.filter(function (x) { return I.price(x.name) !== null; }).map(function (x) { var spare = x.qty - eqCount(x.name); return { name: x.name, have: x.qty, eq: eqCount(x.name), left: spare - (sell[x.name] || 0) }; }); }
  function theirs() { return SH.stock.map(function (x) { return { name: x.name, left: x.qty - (buy[x.name] || 0) }; }); }
  function totals() { var b = 0, s = 0; Object.keys(buy).forEach(function (n) { b += buyCp(n) * buy[n]; }); Object.keys(sell).forEach(function (n) { s += sellCp(n) * sell[n]; }); return { buy: b, sell: s, net: s - b }; }
  // ---------- tooltip ----------
  function tipHtml(n, side) {
    var w = DATA.WEAPONS[n], a = DATA.ARMOR[n], M = I.MAGIC[n], t = '', warn = '';
    if (w) { t = (w.cat === 'martial' ? 'Martial' : 'Simple') + ' ' + w.kind + ' weapon'; if (!I.weaponProf(H, w)) warn = 'You are not proficient with this weapon.'; }
    else if (a) { t = a.type === 'shield' ? 'Shield' : a.type.charAt(0).toUpperCase() + a.type.slice(1) + ' armour'; if (!I.armorProf(H, a)) warn = 'You are not proficient: you cannot equip this.'; else if (a.str && H.scores.str < a.str) warn = 'Needs Strength ' + a.str + ' (speed -10 ft otherwise).'; }
    else if (M) t = M.type === 'potion' ? 'Consumable' : M.type.charAt(0).toUpperCase() + M.type.slice(1) + (M.attune ? ' - requires attunement' : ''); else t = 'Adventuring gear';
    var bp = buyCp(n), sp = sellCp(n);
    return '<h4 style="color:' + RC[rarity(n)] + '">' + esc(n) + '</h4><div class="t">' + t + '</div><div>' + esc(I.describe(n) || (/pack/i.test(n) ? 'A bundle of useful adventuring supplies.' : 'Useful kit.')) + '</div>' + (warn ? '<div class="w">' + warn + '</div>' : '') +
      '<div class="pr">' + (side === 'm' ? 'Buy for ' + fmt(bp) : 'Sell for ' + fmt(sp)) + '<span style="color:var(--dim)"> (worth ' + fmt(I.priceCp(n)) + ')</span></div>';
  }
  // ---------- render ----------
  function tile(x, side) {
    var off = x.left <= 0; return '<div class="tile r' + rarity(x.name) + (off ? ' off' : '') + '" style="color:' + RC[rarity(x.name)] + '" data-s="' + side + '" data-n="' + esc(x.name) + '">' + icon(x.name) + (x.left > 1 ? '<span class="q">' + x.left + '</span>' : '') + (x.eq ? '<span class="e">E</span>' : '') + '</div>';
  }
  function list(items, side) { var f = items.filter(function (x) { return tab === 'all' || I.category(x.name) === tab; }); return f.length ? f.map(function (x) { return tile(x, side); }).join('') : '<div class="empty">Nothing here.</div>'; }
  function rows(map, side, cpf) { var k = Object.keys(map).filter(function (n) { return map[n] > 0; }); return k.length ? k.map(function (n) { return '<div class="row"><span class="n">' + esc(n) + (map[n] > 1 ? ' x' + map[n] : '') + '</span><span class="p">' + fmt(cpf(n) * map[n]) + '</span><button data-rm="' + side + '" data-n="' + esc(n) + '" title="Remove one">-</button></div>'; }).join('') : '<div class="empty" style="padding:4px 0">Click an item to add it.</div>'; }
  function dispLabel() { var d = T.disp; return (d <= -2 ? 'Hostile' : d < 0 ? 'Wary' : d === 0 ? 'Neutral' : d < 3 ? 'Friendly' : 'Beloved') + (MOD ? ' (' + (MOD > 0 ? '' : '+') + Math.round(-MOD * 100) + '% on prices)' : ''); }
  function render() {
    if (!H) { app.innerHTML = '<div class="pane"><div class="empty">No active character. Open the character creator and press "play in 3D" first.</div></div>'; return; }
    var t = totals(), ok = true, why = '';
    if (!t.buy && !t.sell) { ok = false; why = 'Select items to buy or sell.'; } else if (t.net < 0 && I.wealthCp(H) < -t.net) { ok = false; why = 'You are ' + fmt(-t.net - I.wealthCp(H)) + ' short.'; } else if (t.net > 0 && SH.cp < t.net) { ok = false; why = 'The merchant can only pay ' + fmt(SH.cp) + '.'; }
    app.innerHTML = '<div class="top"><div><h1>' + esc(T.npc) + '</h1><div class="sub">' + esc(T.role) + ' of ' + esc(T.town) + ' - ' + dispLabel() + '</div></div><div class="sp"></div><div class="tabs">' + TABS.map(function (x) { return '<button class="tab' + (tab === x[0] ? ' on' : '') + '" data-tab="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div><button class="x" id="close" title="Close (Esc)">&#10005;</button></div>' +
      '<div class="cols"><div class="pane"><div class="ph"><b>' + esc(H.name) + '</b><span>' + fmt(I.wealthCp(H)) + '</span></div><div class="grid">' + list(mine(), 'p') + '</div></div>' +
      '<div class="pane"><div class="ph"><b>Barter</b></div><div class="mid"><h3>You give</h3>' + rows(sell, 'p', sellCp) + '<h3>You receive</h3>' + rows(buy, 'm', buyCp) + '</div>' +
      '<div class="sum"><div class="l"><span>You pay</span><b>' + fmt(t.buy) + '</b></div><div class="l"><span>You get</span><b>' + fmt(t.sell) + '</b></div><div class="l"><span>Result</span><b style="color:' + (t.net < 0 ? 'var(--bad)' : 'var(--good)') + '">' + (t.net < 0 ? '-' : '+') + fmt(Math.abs(t.net)) + '</b></div><div id="st" class="' + (msgc || (ok ? '' : 'bad')) + '">' + esc(msg || why) + '</div><button class="go" id="go"' + (ok ? '' : ' disabled') + '>Confirm trade</button><button class="ghost" id="reset">Clear selection</button></div></div>' +
      '<div class="pane"><div class="ph"><b>Wares</b><span>' + fmt(SH.cp) + '</span></div><div class="grid">' + list(theirs(), 'm') + '</div></div></div>';
  }
  // ---------- actions ----------
  function add(side, n, all) {
    msg = ''; msgc = '';
    if (side === 'm') { var left = stockQty(n) - (buy[n] || 0); if (left <= 0) return; buy[n] = (buy[n] || 0) + (all ? left : 1); }
    else { var x = mine().filter(function (y) { return y.name === n; })[0]; if (!x || x.left <= 0) { if (x && x.eq) { msg = 'Unequip it first to sell it.'; msgc = 'bad'; } render(); return; } sell[n] = (sell[n] || 0) + (all ? x.left : 1); }
    render();
  }
  function confirm() {
    var t = totals(); if (!t.buy && !t.sell) return; if (t.net < 0 && I.wealthCp(H) < -t.net) return; if (t.net > 0 && SH.cp < t.net) return;
    Object.keys(buy).forEach(function (n) { if (buy[n] <= 0) return; I.addItem(H, n, buy[n]); var s = SH.stock.filter(function (x) { return x.name === n; })[0]; if (s) { s.qty -= buy[n]; if (s.qty <= 0) SH.stock.splice(SH.stock.indexOf(s), 1); } });
    Object.keys(sell).forEach(function (n) { if (sell[n] <= 0) return; I.drop(H, n, sell[n]); var s = SH.stock.filter(function (x) { return x.name === n; })[0]; if (s) s.qty += sell[n]; else SH.stock.push({ name: n, qty: sell[n] }); });
    I.setWealthCp(H, I.wealthCp(H) + t.net); SH.cp -= t.net; I.recompute(H); I.saveActive(H); saveShop();
    try { if (window.parent !== window) window.parent.postMessage({ dndHero: true }, '*'); } catch (e) { }
    buy = {}; sell = {}; msg = 'Trade complete.'; msgc = 'ok'; render();
  }
  function closeShop() { try { if (window.parent !== window) { window.parent.postMessage({ dndShopClose: true }, '*'); return; } } catch (e) { } if (history.length > 1) history.back(); }
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-rm],.tile,#go,#reset,#close'); if (!t) return;
    if (t.id === 'close') return closeShop(); if (t.id === 'go') return confirm(); if (t.id === 'reset') { buy = {}; sell = {}; msg = ''; msgc = ''; return render(); }
    if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
    if (t.dataset.rm) { var m = t.dataset.rm === 'm' ? buy : sell; if (m[t.dataset.n] > 0) m[t.dataset.n]--; if (!m[t.dataset.n]) delete m[t.dataset.n]; msg = ''; msgc = ''; return render(); }
    if (t.classList.contains('tile')) add(t.dataset.s, t.dataset.n, e.shiftKey);
  });
  app.addEventListener('mouseover', function (e) { var t = e.target.closest('.tile'); if (!t || !H) { tip.style.display = 'none'; return; } tip.innerHTML = tipHtml(t.dataset.n, t.dataset.s); tip.style.display = 'block'; });
  app.addEventListener('mousemove', function (e) { if (tip.style.display === 'none') return; var x = e.clientX + 16, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight; if (x + w > innerWidth - 6) x = e.clientX - w - 16; if (y + h > innerHeight - 6) y = innerHeight - h - 6; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
  app.addEventListener('mouseout', function (e) { if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.tile')) tip.style.display = 'none'; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeShop(); else if (e.key === 'Enter') confirm(); });
  window.addEventListener('message', function (e) { if (e.data && e.data.dndRefresh) { load(); render(); } });
  load(); render();
})();
</script></body></html>
