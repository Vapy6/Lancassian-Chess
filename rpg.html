<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myosia — D&D Campaign</title>
<style>
:root{--bg:#11151a;--panel:#1b222a;--panel2:#222b35;--ink:#e9e4d8;--muted:#a7b0b8;--gold:#d8b66b;--line:#35414d;--red:#d47a70;--green:#8dbb91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;padding:8px 11px}button.primary{background:var(--gold);color:#1b170e;border-color:var(--gold);font-weight:700}button.danger{border-color:#70433f;color:#f1aaa0}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{background:#11171d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}textarea{width:100%;min-height:90px}.top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top h1{font:600 23px Georgia,serif;color:var(--gold);margin:0}.top .grow{flex:1}.wrap{max-width:1250px;margin:auto;padding:18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}.tabs button[aria-selected=true]{background:var(--gold);color:#1b170e;border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}h2{font:600 13px system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}h3{font:600 17px Georgia,serif;margin:0 0 8px}.muted,.small{color:var(--muted);font-size:12px}.statrow{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--panel2);border-radius:8px;padding:9px 12px;min-width:84px}.stat b{display:block;font-size:22px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row>*{min-width:0}.row .grow{flex:1}.list{display:grid;gap:7px}.item{padding:9px;background:#151c23;border:1px solid var(--line);border-radius:7px;display:flex;gap:8px;align-items:center;justify-content:space-between}.item .desc{min-width:0;flex:1}.pill{font-size:11px;color:var(--gold);border:1px solid #685938;padding:2px 7px;border-radius:99px}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none!important}.empty{color:var(--muted);padding:15px;text-align:center;border:1px dashed var(--line);border-radius:8px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fields label{display:grid;gap:4px;color:var(--muted);font-size:12px}.fields input,.fields select{width:100%}.log{max-height:260px;overflow:auto;background:#10151a;border:1px solid var(--line);border-radius:7px;padding:9px;font-size:13px}.log div{padding:3px 0;border-bottom:1px solid #26303a}.footer{color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:760px){.c8,.c6,.c4{grid-column:span 12}.wrap{padding:10px}.fields{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><h1>Myosia · D&D Campaign</h1><span class="pill">2014 ruleset</span><span class="grow"></span><select id="campaignSelect" aria-label="Campaign"></select><button id="newCampaign" class="primary">New campaign</button><button id="saveNow">Save</button><button id="exportSave">Export</button><button id="importSave">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden></header>
<main class="wrap"><nav class="tabs" id="tabs" aria-label="Campaign sections"></nav><div id="view"></div><div class="footer">Rules engine and character creator are shared with the existing Myosia project. Campaign saves are stored in this browser; cloud campaign sync remains managed by the Worldbuilder Campaign panel.</div></main>
<script src="dnd-data.js"></script><script src="dnd-rules.js"></script><script src="dnd-campaign.js"></script>
<script>
(function(){
'use strict';
var D=window.DND,C=window.DNDCAMPAIGN,$=function(id){return document.getElementById(id)},campaign=C.active(),tab='overview',rolls=[];
var tabs=[['overview','Overview'],['character','Character'],['inventory','Inventory'],['quests','Quests & Journal'],['dice','Dice'],['dm','DM Tools'],['world','World']];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ensure(){if(!campaign)campaign=C.create('Myosia Campaign');campaign=C.load(campaign.id);renderAll()}
function save(){try{C.save(campaign);$('saveNow').textContent='Saved';setTimeout(function(){$('saveNow').textContent='Save'},1100)}catch(e){alert(e.message)}}
function char(){return C.activeCharacter(campaign)}
function setChar(ch){campaign.activeCharacterId=ch.id;save();renderAll()}
function changeTab(t){tab=t;render()}
function renderTabs(){$('tabs').innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('')}
function renderCampaigns(){var a=C.slots();$('campaignSelect').innerHTML=a.map(function(x){return '<option value="'+esc(x.id)+'" '+(campaign&&campaign.id===x.id?'selected':'')+'>'+esc(x.name)+'</option>'}).join('')||'<option value="">No campaign</option>'}
function empty(s){return '<div class="empty">'+s+'</div>'}
function stat(label,value){return '<div class="stat"><span class="small">'+label+'</span><b>'+esc(value)+'</b></div>'}
function renderOverview(){var ch=char();return '<div class="grid"><section class="card c8"><h2>Active adventurer</h2>'+(ch?'<h3>'+esc(ch.name)+' · '+esc(ch.race||'')+' '+esc(ch.cls||'')+'</h3><div class="statrow">'+stat('Level',ch.level||1)+stat('Hit Points',(ch.currentHp===undefined?ch.hp:ch.currentHp)+' / '+ch.hpMax)+stat('Armor Class',ch.ac)+stat('Proficiency','+'+(ch.profBonus||2))+stat('XP',ch.xp||0)+'</div><div class="row"><button data-go="character">Character sheet</button><button data-go="inventory">Inventory</button><a href="character.html"><button>Create character</button></a></div>':'<p class="muted">No character is assigned to this campaign.</p><a href="character.html"><button class="primary">Create a character</button></a>')+'</section><section class="card c4"><h2>Campaign record</h2>'+stat('Party',campaign.party.length)+stat('Active quests',campaign.quests.filter(function(q){return q.status==='active'}).length)+stat('Journal entries',campaign.journal.length)+'<p class="muted">Last saved '+esc(new Date(campaign.updatedAt).toLocaleString())+'</p></section><section class="card c6"><h2>Party roster</h2>'+partyHtml()+'</section><section class="card c6"><h2>Recent journal</h2>'+journalHtml(5)+'</section></div>'}
function partyHtml(){return campaign.characters.length?'<div class="list">'+campaign.characters.map(function(x){return '<div class="item"><div class="desc"><b>'+esc(x.name)+'</b><div class="small">'+esc(x.race||'')+' '+esc(x.cls||'')+' · Level '+(x.level||1)+' · HP '+(x.currentHp===undefined?x.hp:x.currentHp)+'/'+x.hpMax+'</div></div><button data-active="'+esc(x.id)+'">'+(campaign.activeCharacterId===x.id?'Active':'Switch')+'</button></div>'}).join('')+'</div>':empty('Add a character from the existing character creator.')}
function journalHtml(n){var a=campaign.journal.slice().reverse().slice(0,n);return a.length?'<div class="list">'+a.map(function(x){return '<div class="item"><div class="desc"><b>'+esc(x.title)+'</b><div class="small">'+esc(x.type)+' · '+esc(new Date(x.at).toLocaleString())+'</div><div>'+esc(x.body)+'</div></div></div>'}).join('')+'</div>':empty('No journal entries yet.')}
function renderCharacter(){var ch=char();if(!ch)return '<section class="card">'+empty('Create a character, then add it to this campaign from the character creator page.')+'<a href="character.html"><button class="primary">Open character creator</button></a></section>';
var ab=D.ABILITIES.map(function(a){return stat(D.ABILITY_NAMES[a],ch.scores[a]+' ('+D.signed(ch.mods[a])+')')}).join('');
var skills=D.ALL_SKILLS.map(function(s){var x=ch.skills[s];return '<div class="item"><span>'+esc(s)+' <span class="small">('+x.ability.toUpperCase()+')</span></span><b>'+D.signed(x.bonus)+'</b></div>'}).join('');
return '<div class="grid"><section class="card c8"><h2>Character sheet</h2><h3>'+esc(ch.name)+' · Level '+ch.level+' '+esc(ch.race||'')+' '+esc(ch.cls)+'</h3><div class="statrow">'+stat('HP',ch.currentHp+'/'+ch.hpMax)+stat('Temp HP',ch.tempHp)+stat('AC',ch.ac)+stat('Initiative',D.signed(ch.initiative))+stat('Speed',(ch.speed||30)+' ft')+stat('Passive Perception',ch.passivePerception)+stat('Hit Dice',ch.hitDice.remaining+'/'+ch.hitDice.total+' '+ch.hitDice.die)+'</div><div class="row"><label>Current HP <input id="hpNow" type="number" min="0" max="'+ch.hpMax+'" value="'+ch.currentHp+'"></label><label>Temp HP <input id="tempNow" type="number" min="0" value="'+ch.tempHp+'"></label><label><input id="inspiration" type="checkbox" '+(ch.inspiration?'checked':'')+'> Inspiration</label><button id="applyHp">Update</button></div><h2>Ability scores</h2><div class="statrow">'+ab+'</div><h2>Saving throws</h2><div class="statrow">'+D.ABILITIES.map(function(a){return stat(a.toUpperCase(),D.signed(ch.saves[a].bonus)+(ch.saves[a].proficient?' · Prof':'') )}).join('')+'</div></section><section class="card c4"><h2>Recovery</h2><p class="muted">A short rest is one hour. Spend available Hit Dice to heal. Long rests restore HP and recover half your total Hit Dice (minimum one), subject to the 24-hour restriction.</p><div class="row"><label>Hit Dice to spend <input id="hdSpend" type="number" min="0" max="'+ch.hitDice.remaining+'" value="1"></label></div><button id="shortRest">Take short rest</button> <button id="longRest">Take long rest</button><div id="restResult" class="small"></div><h2>Conditions</h2><div class="row"><input id="conditionName" placeholder="Condition name"><button id="addCondition">Add</button></div><div class="row">'+(ch.conditions.length?ch.conditions.map(function(x){return '<span class="pill">'+esc(x)+'</span><button data-remove-condition="'+esc(x)+'">×</button>'}).join(' '):'<span class="muted">No conditions</span>')+'</div></section><section class="card c6"><h2>Skills</h2><div class="list">'+skills+'</div></section><section class="card c6"><h2>Features & proficiencies</h2><ul>'+(ch.features||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p class="small">Armor: '+esc((ch.armor||[]).join(', '))+'<br>Weapons: '+esc((ch.weapons||[]).join(', '))+'<br>Languages: '+esc((ch.languages||[]).join(', '))+'</p></section></div>'}
function renderInventory(){var ch=char();if(!ch)return empty('Add a character first.');return '<div class="grid"><section class="card c8"><h2>Inventory</h2>'+(ch.inventory.length?'<div class="list">'+ch.inventory.map(function(x){return '<div class="item"><div class="desc"><b>'+esc(x.name)+'</b> <span class="pill">'+esc(x.category)+'</span><div class="small">Qty '+x.qty+' · '+(x.weight||0)+' lb '+(x.magical?'· Magical '+esc(x.rarity||''):'')+'</div><div class="small">'+esc(x.description||'')+'</div></div><button data-remove-item="'+esc(x.id)+'">Remove</button></div>'}).join('')+'</div>':empty('No items in inventory.'))+'</section><section class="card c4"><h2>Add item</h2><div class="fields"><label>Item name<input id="itemName" placeholder="Potion of healing"></label><label>Category<select id="itemCategory"><option>gear</option><option>weapon</option><option>armor</option><option>potion</option><option>scroll</option><option>tool</option><option>quest</option><option>magic</option><option>treasure</option></select></label><label>Quantity<input id="itemQty" type="number" min="1" value="1"></label><label>Weight (lb)<input id="itemWeight" type="number" min="0" step=".1" value="0"></label></div><label class="row"><input id="itemMagic" type="checkbox"> Magical item</label><label>Rarity<select id="itemRarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Very Rare</option><option>Legendary</option><option>Artifact</option></select></label><label class="row"><input id="itemAttune" type="checkbox"> Requires attunement</label><label>Description<textarea id="itemDesc"></textarea></label><button id="addItem" class="primary">Add to inventory</button><h2>Carrying</h2><div>'+C.carryWeight(ch)+' / '+C.carryCapacity(ch)+' lb</div><h2>Currency (gp)</h2><input id="gold" type="number" min="0" value="'+(ch.currency.gp||0)+'"><button id="saveGold">Update gold</button></section></div>'}
function renderQuests(){return '<div class="grid"><section class="card c8"><h2>Quest log</h2>'+(campaign.quests.length?'<div class="list">'+campaign.quests.map(function(q){return '<div class="item"><div class="desc"><b>'+esc(q.title)+'</b> <span class="pill">'+esc(q.status)+'</span><div class="small">'+esc(q.description)+'</div>'+(q.objectives||[]).map(function(o){return '<label class="row"><input type="checkbox" data-objective="'+esc(q.id)+'|'+esc(o.id)+'" '+(o.done?'checked':'')+'> '+esc(o.text)+'</label>'}).join('')+'<div class="small">Reward: '+(q.rewards.xp||0)+' XP · '+(q.rewards.gp||0)+' gp</div></div><button class="danger" data-delete-quest="'+esc(q.id)+'">Delete</button></div>'}).join('')+'</div>':empty('No quests created.'))+'</section><section class="card c4"><h2>Create quest</h2><label>Title<input id="questTitle"></label><label>Description<textarea id="questDesc"></textarea></label><label>Objectives (one per line)<textarea id="questObjectives"></textarea></label><div class="fields"><label>XP reward<input id="questXp" type="number" min="0" value="0"></label><label>Gold reward<input id="questGp" type="number" min="0" value="0"></label></div><button id="addQuest" class="primary">Create quest</button></section><section class="card c12"><h2>Campaign journal</h2><div class="fields"><label>Entry title<input id="journalTitle" value="Session notes"></label><label>Entry type<select id="journalType"><option>note</option><option>discovery</option><option>NPC</option><option>location</option><option>decision</option></select></label></div><label>Notes<textarea id="journalBody"></textarea></label><button id="addJournal">Add journal entry</button><div style="margin-top:12px">'+journalHtml(30)+'</div></section></div>'}
function renderDice(){return '<div class="grid"><section class="card c6"><h2>Dice roller</h2><div class="row"><input id="diceExpr" value="1d20+3" aria-label="Dice expression"><select id="diceMode"><option value="normal">Normal</option><option value="adv">Advantage</option><option value="dis">Disadvantage</option></select><button id="rollDice" class="primary">Roll</button></div><div id="diceResult" class="statrow"></div><p class="small">Supports compound expressions: 1d20+5, 2d6+3, 4d8, and d100. Advantage/disadvantage apply to a single d20.</p></section><section class="card c6"><h2>Roll history</h2><div id="rollHistory" class="log">'+(rolls.length?rolls.slice().reverse().map(function(r){return '<div>'+esc(r.expression)+' → <b>'+r.total+'</b> ('+r.rolls.map(function(x){return x.value}).join(', ')+')</div>'}).join(''): 'No rolls yet.')+'</div></section></div>'}
function renderDm(){return '<div class="grid"><section class="card c6"><h2>DM control panel</h2><label class="row"><input id="dmMode" type="checkbox" '+(campaign.settings.dmMode?'checked':'')+'> Enable DM mode on this save</label><p class="muted">Use these tools to prepare encounters, apply checks, award rewards and record rulings. DM overrides are recorded as campaign notes rather than silently changing official rules.</p><div class="fields"><label>Check ability<select id="checkAbility">'+D.ABILITIES.map(function(a){return '<option value="'+a+'">'+a.toUpperCase()+'</option>'}).join('')+'</select></label><label>DC<input id="checkDc" type="number" value="15"></label><label>Situational modifier<input id="checkMod" type="number" value="0"></label><label>Roll mode<select id="checkMode"><option value="normal">Normal</option><option value="adv">Advantage</option><option value="dis">Disadvantage</option></select></label></div><button id="requestCheck">Roll ability check</button><div id="dmResult" class="small"></div></section><section class="card c6"><h2>Award party rewards</h2><div class="fields"><label>XP<input id="awardXp" type="number" min="0" value="0"></label><label>Gold<input id="awardGp" type="number" min="0" value="0"></label><label>Item<input id="awardItem" placeholder="Item name"></label><label>Quantity<input id="awardQty" type="number" min="1" value="1"></label></div><button id="awardReward" class="primary">Award active character</button><h2>Encounter launcher</h2><p class="muted">Use the existing initiative and battle tester. Characters saved by the character creator are available there.</p><a href="battle.html"><button>Open battle tester</button></a></section></div>'}
function renderWorld(){return '<div class="grid"><section class="card c6"><h2>World exploration</h2><p>Continue exploring the existing Myosia world map and 3D environment. The RPG campaign state keeps discoveries and world notes alongside quests and journal entries.</p><div class="row"><a href="map.html"><button class="primary">Open world map</button></a><a href="world3d.html"><button>Enter 3D world</button></a><a href="worldbuilder.html"><button>Open worldbuilder</button></a></div><label>Campaign world notes<textarea id="worldNotes">'+esc(campaign.world.notes||'')+'</textarea></label><button id="saveWorld">Save world notes</button></section><section class="card c6"><h2>Discovered locations</h2><div class="row"><input id="discovery" placeholder="Location name"><button id="addDiscovery">Record discovery</button></div>'+(campaign.world.discovered.length?'<div class="list">'+campaign.world.discovered.map(function(x){return '<div class="item">'+esc(x)+'</div>'}).join('')+'</div>':empty('No discoveries recorded.'))+'</section></div>'}
function render(){renderTabs();var html=tab==='overview'?renderOverview():tab==='character'?renderCharacter():tab==='inventory'?renderInventory():tab==='quests'?renderQuests():tab==='dice'?renderDice():tab==='dm'?renderDm():renderWorld();$('view').innerHTML=html;renderCampaigns()}
function renderAll(){renderCampaigns();render()}
function activeSave(){save();renderAll()}
$('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)changeTab(b.dataset.tab)});
$('view').addEventListener('click',function(e){var t=e.target.closest('button,input');if(!t)return;
if(t.dataset.go){changeTab(t.dataset.go);return}if(t.dataset.active){setChar(t.dataset.active);return}
if(t.id==='applyHp'){var ch=char();ch.currentHp=Math.max(0,Math.min(ch.hpMax,+$('hpNow').value||0));ch.tempHp=Math.max(0,+$('tempNow').value||0);ch.inspiration=$('inspiration').checked;C.syncCharacterToLegacy(campaign,ch);activeSave()}
if(t.id==='shortRest'){var ch=char();var r=C.shortRest(ch,+$('hdSpend').value||0);$('restResult').textContent='Spent '+r.spent+' Hit Dice; healed '+r.healed+' HP. '+r.remaining+' Hit Dice remain.';C.syncCharacterToLegacy(campaign,ch);activeSave()}
if(t.id==='longRest'){try{var ch=char();var r=C.longRest(ch);$('restResult').textContent='Long rest complete: restored '+r.healed+' HP; recovered Hit Dice.';C.syncCharacterToLegacy(campaign,ch);activeSave()}catch(err){$('restResult').textContent=err.message}}
if(t.id==='addCondition'){var ch=char(),v=$('conditionName').value.trim().toLowerCase();if(v&&ch.conditions.indexOf(v)<0)ch.conditions.push(v);activeSave()}
if(t.dataset.removeCondition){var ch=char();ch.conditions=ch.conditions.filter(function(x){return x!==t.dataset.removeCondition});activeSave()}
if(t.id==='addItem'){var ch=char(),name=$('itemName').value.trim();if(!name)return;var magical=$('itemMagic').checked,attune=$('itemAttune').checked;if(attune&&ch.attuned.length>=3){alert('A character can normally be attuned to no more than three items.');return}C.addItem(ch,name,+$('itemQty').value,{category:$('itemCategory').value,weight:+$('itemWeight').value||0,magical:magical,rarity:magical?$('itemRarity').value:null,attunement:attune,description:$('itemDesc').value});activeSave()}
if(t.dataset.removeItem){var ch=char();C.removeItem(ch,t.dataset.removeItem,1);activeSave()}
if(t.id==='saveGold'){var ch=char();ch.currency.gp=Math.max(0,+$('gold').value||0);activeSave()}
if(t.id==='addQuest'){var title=$('questTitle').value.trim();if(!title)return;var objectives=$('questObjectives').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return{id:'obj-'+Math.random().toString(36).slice(2,8),text:x,done:false}});C.addQuest(campaign,{title:title,description:$('questDesc').value,objectives:objectives,rewards:{xp:+$('questXp').value||0,gp:+$('questGp').value||0,items:[]}});activeSave()}
if(t.dataset.deleteQuest){campaign.quests=campaign.quests.filter(function(q){return q.id!==t.dataset.deleteQuest});activeSave()}
if(t.id==='addJournal'){C.journal(campaign,{title:$('journalTitle').value,body:$('journalBody').value,type:$('journalType').value});activeSave()}
if(t.id==='rollDice'){try{var r=C.roll($('diceExpr').value,$('diceMode').value);rolls.push(r);$('diceResult').innerHTML=stat('Total',r.total)+stat('Dice',r.rolls.map(function(x){return x.value}).join(', '))+stat('Mode',r.mode)+(r.critical?'<span class="good">Critical</span>':'')+(r.fumble?'<span class="bad">Natural 1</span>':'');$('rollHistory').innerHTML=rolls.slice().reverse().map(function(x){return '<div>'+esc(x.expression)+' → <b>'+x.total+'</b> ('+x.rolls.map(function(z){return z.value}).join(', ')+')</div>'}).join('')}catch(err){$('diceResult').textContent=err.message}}
if(t.id==='dmMode'){campaign.settings.dmMode=t.checked;save()}
if(t.id==='requestCheck'){var ch=char();if(!ch){$('dmResult').textContent='Add a character first.';return}var a=$('checkAbility').value,mod=ch.mods[a]+ +$('checkMod').value,mode=$('checkMode').value,r=C.roll('1d20',mode),total=r.total+mod,dc=+$('checkDc').value;$('dmResult').textContent='d20 '+r.rolls.map(function(x){return x.value}).join('/')+' '+D.signed(mod)+' = '+total+' vs DC '+dc+': '+(total>=dc?'Success':'Failure');C.journal(campaign,{type:'DM check',title:a.toUpperCase()+' check',body:$('dmResult').textContent});save()}
if(t.id==='awardReward'){var ch=char();if(!ch)return;var item=$('awardItem').value.trim();C.award(campaign,ch,{xp:+$('awardXp').value||0,gp:+$('awardGp').value||0,items:item?[{name:item,qty:+$('awardQty').value||1}]:[]});C.syncCharacterToLegacy(campaign,ch);activeSave()}
if(t.id==='saveWorld'){campaign.world.notes=$('worldNotes').value;activeSave()}
if(t.id==='addDiscovery'){var v=$('discovery').value.trim();if(v&&campaign.world.discovered.indexOf(v)<0)campaign.world.discovered.push(v);activeSave()}
});
$('view').addEventListener('change',function(e){var t=e.target;if(t.dataset.objective){var p=t.dataset.objective.split('|');C.setObjective(campaign,p[0],p[1],t.checked);activeSave()}});
$('campaignSelect').addEventListener('change',function(){if(this.value){campaign=C.load(this.value);renderAll()}});
$('newCampaign').onclick=function(){var n=prompt('Campaign name','Myosia Campaign');if(n){campaign=C.create(n);tab='overview';renderAll()}};
$('saveNow').onclick=save;
$('exportSave').onclick=function(){try{var blob=new Blob([C.exportSave(campaign)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(campaign.name.replace(/[^a-z0-9_-]/gi,'-')||'campaign')+'.json';a.click();URL.revokeObjectURL(url)}catch(e){alert(e.message)}};
$('importSave').onclick=function(){$('importFile').click()};
$('importFile').onchange=function(){var f=this.files&&this.files[0];this.value='';if(!f)return;var reader=new FileReader();reader.onload=function(){try{campaign=C.importSave(String(reader.result));renderAll()}catch(e){alert(e.message)}};reader.readAsText(f)};
window.addEventListener('storage',function(e){if(e.key==='dnd.characters'&&campaign)renderAll()});
if(!campaign)campaign=C.create('Myosia Campaign');
/* Bring existing locally saved character sheets into this campaign on first visit. */
if(!campaign.characters.length){try{var saved=JSON.parse(localStorage.getItem('dnd.characters')||'[]');saved.forEach(function(x){C.addCharacter(campaign,x)});if(campaign.characters.length)C.save(campaign)}catch(e){}}
renderAll();
})();
</script></body></html>
