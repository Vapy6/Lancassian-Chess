<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Creator</title>
<style>
:root{--bg:#14171c;--card:#1d222a;--ink:#e8e4da;--dim:#9aa3ad;--acc:#d9b45a;--bad:#e07a6a;--ok:#7fc08a;--line:#2e3540}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font:600 22px Georgia,serif;margin:0 0 4px;color:var(--acc)}h2{font:600 14px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 2px}select,input[type=text],input[type=number]{width:100%;background:#12151a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{background:#12151a;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.ab b{display:block;font-size:11px;color:var(--dim);letter-spacing:.06em}
.ab .tot{font:600 22px Georgia,serif}.ab .md{color:var(--acc);font-size:13px}.ab button{background:#252c36;color:var(--ink);border:1px solid var(--line);border-radius:5px;width:28px;height:28px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 9px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;background:#12151a;user-select:none}
.chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc)}.chip.off{opacity:.35;cursor:not-allowed}
.err{color:var(--bad);margin:2px 0;font-size:13px}.ok{color:var(--ok)}.btn{background:var(--acc);color:#1a1405;border:0;border-radius:7px;padding:8px 14px;font-weight:600;cursor:pointer;margin:4px 6px 0 0}
.btn.g{background:#2a313b;color:var(--ink)}.sheet h3{font:600 24px Georgia,serif;margin:0}.sub{color:var(--dim)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.st{background:#12151a;border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px}.st b{display:block;font:600 20px Georgia,serif}.st span{font-size:11px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:2px 4px;border-bottom:1px solid #232a33}td.n{text-align:right;width:40px;font-variant-numeric:tabular-nums}.pf{color:var(--acc)}
ul{margin:4px 0 0 18px;padding:0}textarea{width:100%;min-height:80px;background:#12151a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;resize:vertical}.tw{white-space:pre-wrap}details summary{cursor:pointer;color:var(--dim);font-size:13px}.sp{font-size:12px;color:var(--dim);margin:2px 0 6px}@media print{.left,#errs,.btn,#saved,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}}.note{font-size:12px;color:var(--dim)}
</style></head><body>
<div class="wrap">
 <div class="left">
  <div class="card"><h1>Character Creator</h1><div class="note">D&amp;D 5e SRD 5.1 rules (CC-BY-4.0). Level 1.</div>
   <label>Name</label><input type="text" id="name" placeholder="Name your hero">
   <div class="row"><div><label>Species</label><select id="race"></select></div><div><label>Subrace</label><select id="subrace"></select></div></div>
   <div class="row"><div><label>Class</label><select id="cls"></select></div><div><label>Background</label><select id="bg"></select></div></div>
  </div>
  <div class="card"><h2>Ability scores</h2>
   <div class="chips" id="methods"></div><div class="note" id="mnote" style="margin:6px 0"></div>
   <div class="abil" id="abil"></div><div id="rollrow" style="display:none"><button class="btn g" id="reroll">Roll 4d6 (drop lowest)</button></div>
  </div>
  <div class="card"><h2>Skills</h2><div id="skillblocks"></div></div>
  <div class="card"><h2>Starting equipment</h2><div id="kit"></div><label>Starting gold (optional)</label><input type="number" id="gp" min="0" value="0"></div>
  <div class="card" id="spellcard" style="display:none"><h2>Spells</h2><div id="spellblocks"></div></div>
  <div class="card"><h2>Character details</h2>
   <div class="row"><div><label>Alignment</label><select id="d_alignment"></select></div><div><label>Deity / faith</label><input type="text" id="d_deity" placeholder="Who do they worship?"></div></div>
   <div class="row"><div><label>Gender / pronouns</label><input type="text" id="d_gender"></div><div><label>Age</label><input type="text" id="d_age"></div></div>
   <div class="row"><div><label>Height</label><input type="text" id="d_height"></div><div><label>Weight</label><input type="text" id="d_weight"></div></div>
   <div class="row"><div><label>Eyes</label><input type="text" id="d_eyes"></div><div><label>Skin</label><input type="text" id="d_skin"></div></div>
   <label>Hair</label><input type="text" id="d_hair">
   <label>Appearance</label><textarea id="d_appearance"></textarea><label>Personality traits</label><textarea id="d_personality"></textarea>
   <div class="row"><div><label>Ideals</label><textarea id="d_ideals"></textarea></div><div><label>Bonds</label><textarea id="d_bonds"></textarea></div></div>
   <label>Flaws</label><textarea id="d_flaws"></textarea><label>Backstory</label><textarea id="d_backstory" style="min-height:140px"></textarea>
   <label>Allies &amp; organizations</label><textarea id="d_allies"></textarea><label>Treasure</label><textarea id="d_treasure"></textarea><label>Notes</label><textarea id="d_notes"></textarea><label>Experience points</label><input type="text" id="d_xp" value="0">
  </div>
 </div>
 <div>
  <div class="card"><div id="errs"></div><div id="sheet" class="sheet"></div>
   <div style="margin-top:8px"><button class="btn" id="save">Save</button><button class="btn g" id="export">Export JSON</button><button class="btn g" id="print">Print</button></div></div>
  <div class="card"><h2>Saved characters</h2><div id="saved" class="note"></div></div>
 </div>
</div>
<script src="dnd-data.js"></script>
<script src="dnd-rules.js"></script>
<script>
(function () {
  var D = window.DND, X = window.DNDDATA, $ = function (id) { return document.getElementById(id); };
  var S = { method: 'pointbuy', base: { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 }, skills: [], bgSkills: [], raceSkills: [], halfElfAsi: [], expertise: [], style: '', dragon: '', assign: {}, kit: { choices: [], picks: {} }, cantrips: [], known: [], prepared: [] };
  fill($('d_alignment'), ['(unaligned)'].concat(X.ALIGNMENTS));
  function fill(sel, items) { sel.innerHTML = items.map(function (x) { return '<option>' + x + '</option>'; }).join(''); }
  fill($('race'), Object.keys(D.RACES)); fill($('cls'), Object.keys(D.CLASSES)); fill($('bg'), Object.keys(D.BACKGROUNDS)); $('bg').value = 'Acolyte';
  ['pointbuy:Point buy', 'standard:Standard array', 'roll:Roll 4d6', 'manual:Manual'].forEach(function (m) { var p = m.split(':'), c = document.createElement('span'); c.className = 'chip'; c.textContent = p[1]; c.onclick = function () { setMethod(p[0]); }; c.dataset.m = p[0]; $('methods').appendChild(c); });
  function setMethod(m) {
    S.method = m; S.assign = {};
    if (m === 'pointbuy') D.ABILITIES.forEach(function (a) { S.base[a] = 8; });
    if (m === 'standard') D.ABILITIES.forEach(function (a, i) { S.base[a] = D.STANDARD_ARRAY[i]; });
    if (m === 'roll') { var r = D.rollAbilityScores(); D.ABILITIES.forEach(function (a, i) { S.base[a] = r[i]; }); }
    if (m === 'manual') D.ABILITIES.forEach(function (a) { S.base[a] = 10; });
    render();
  }
  function toggle(list, s, max) { var i = list.indexOf(s); if (i >= 0) list.splice(i, 1); else if (list.length < max) list.push(s); }
  function chips(title, opts, list, max, disabled) {
    var h = '<div class="note" style="margin:8px 0 4px">' + title + ' (' + list.length + '/' + max + ')</div><div class="chips">';
    opts.forEach(function (s) { var on = list.indexOf(s) >= 0, off = !on && (disabled(s) || list.length >= max); h += '<span class="chip ' + (on ? 'on' : '') + (off ? ' off' : '') + '" data-s="' + s + '">' + s + '</span>'; });
    return h + '</div>';
  }
  function current() { var race = D.RACES[$('race').value], cls = D.CLASSES[$('cls').value], bg = D.BACKGROUNDS[$('bg').value]; return { race: race, cls: cls, bg: bg }; }
  function render() {
    var c = current(), subs = Object.keys(c.race.subraces), sv = $('subrace').value;
    fill($('subrace'), subs.length ? subs : ['(none)']); $('subrace').disabled = !subs.length; if (subs.indexOf(sv) >= 0) $('subrace').value = sv;
    Array.prototype.forEach.call($('methods').children, function (e) { e.className = 'chip' + (e.dataset.m === S.method ? ' on' : ''); });
    var sub = subs.length ? c.race.subraces[$('subrace').value] : null, bonus = {};
    D.ABILITIES.forEach(function (a) { bonus[a] = (c.race.asi[a] || 0) + (sub && sub.asi && sub.asi[a] || 0) + (c.race.asiChoose && S.halfElfAsi.indexOf(a) >= 0 ? c.race.asiChoose[1] : 0); });
    $('mnote').textContent = S.method === 'pointbuy' ? 'Spend up to 27 points (scores 8-15). Spent: ' + D.pointCost(S.base) : S.method === 'standard' ? 'Assign 15, 14, 13, 12, 10, 8 once each.' : S.method === 'roll' ? 'Rolled scores are placed in order; swap by editing below.' : 'Enter any scores from 3 to 18.';
    $('rollrow').style.display = S.method === 'roll' ? 'block' : 'none';
    $('abil').innerHTML = D.ABILITIES.map(function (a) {
      var tot = Math.min(20, S.base[a] + bonus[a]), ctl;
      if (S.method === 'pointbuy') ctl = '<button data-a="' + a + '" data-d="-1">-</button> ' + S.base[a] + ' <button data-a="' + a + '" data-d="1">+</button>';
      else if (S.method === 'standard') ctl = '<select data-sa="' + a + '">' + D.STANDARD_ARRAY.map(function (v) { return '<option' + (v === S.base[a] ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select>';
      else ctl = '<input type="number" min="3" max="20" value="' + S.base[a] + '" data-na="' + a + '">';
      return '<div class="ab"><b>' + D.ABILITY_NAMES[a].toUpperCase().slice(0, 3) + '</b><div class="tot">' + tot + '</div><div class="md">' + D.signed(D.mod(tot)) + (bonus[a] ? ' <span class="note">(+' + bonus[a] + ' species)</span>' : '') + '</div>' + ctl + '</div>';
    }).join('');
    // skill pickers
    var fixed = c.race.skills.concat(c.bg.skills), h = '';
    h += chips(D_cls() + ' skills', c.cls.skillList, S.skills, c.cls.skillCount, function (s) { return fixed.indexOf(s) >= 0 || S.bgSkills.indexOf(s) >= 0 || S.raceSkills.indexOf(s) >= 0; }).replace(/class="chip/g, 'data-k="skills" class="chip');
    if (c.bg.pick) h += chips('Background skills', D.ALL_SKILLS, S.bgSkills, c.bg.pick, function (s) { return fixed.indexOf(s) >= 0 || S.skills.indexOf(s) >= 0 || S.raceSkills.indexOf(s) >= 0; }).replace(/class="chip/g, 'data-k="bgSkills" class="chip');
    if (c.race.skillsChoose) h += chips('Skill Versatility', D.ALL_SKILLS, S.raceSkills, c.race.skillsChoose, function (s) { return fixed.indexOf(s) >= 0 || S.skills.indexOf(s) >= 0 || S.bgSkills.indexOf(s) >= 0; }).replace(/class="chip/g, 'data-k="raceSkills" class="chip');
    if (c.race.asiChoose) h += chips('Half-Elf: +1 to two abilities', D.ABILITIES.filter(function (a) { return a !== 'cha'; }), S.halfElfAsi, 2, function () { return false; }).replace(/class="chip/g, 'data-k="halfElfAsi" class="chip');
    if (c.cls.expertise) { var prof = [].concat(fixed, S.skills, S.bgSkills, S.raceSkills); h += chips('Expertise', prof, S.expertise, c.cls.expertise, function () { return false; }).replace(/class="chip/g, 'data-k="expertise" class="chip'); }
    function sel(title, key, opts) { return '<label>' + title + '</label><select data-sel="' + key + '"><option value="">- choose -</option>' + opts.map(function (n) { return '<option' + (S[key] === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>'; }
    if ($('cls').value === 'Fighter') h += sel('Fighting Style', 'style', Object.keys(D.FIGHTING_STYLES));
    if ($('race').value === 'Dragonborn') h += sel('Draconic ancestry', 'dragon', Object.keys(D.DRAGON_ANCESTRY));
    if (fixed.length) h = '<div class="note">Granted: ' + fixed.join(', ') + '</div>' + h;
    $('skillblocks').innerHTML = h;
    // equipment
    var kit = X.KITS[$('cls').value], kh = '';
    function picker(tok, key) { var opts = tok === '@instrument' ? X.INSTRUMENTS : Object.keys(X.WEAPONS).filter(function (n) { var w = X.WEAPONS[n]; return tok === '@simple' ? w.cat === 'simple' : tok === '@simplemelee' ? w.cat === 'simple' && w.kind === 'melee' : tok === '@martial' ? w.cat === 'martial' : w.cat === 'martial' && w.kind === 'melee'; });
      return '<select data-pick="' + key + '"><option value="">- choose ' + X.TOKENS[tok] + ' -</option>' + opts.map(function (n) { return '<option' + (S.kit.picks[key] === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select>'; }
    kit.slots.forEach(function (slot, si) {
      kh += '<label>Choice ' + (si + 1) + '</label><select data-kit="' + si + '"><option value="">- choose -</option>' + slot.map(function (op, oi) { return '<option value="' + oi + '"' + (S.kit.choices[si] === oi ? ' selected' : '') + '>' + op.l + '</option>'; }).join('') + '</select>';
      var cho = slot[S.kit.choices[si]]; if (cho) cho.i.forEach(function (it, ti) { if (it.charAt(0) === '@') kh += picker(it, si + '.' + ti); });
    });
    kh += '<div class="note" style="margin-top:8px">Also included: ' + kit.fixed.map(function (f) { return f.charAt(0) === '@' ? '' : f; }).filter(Boolean).join(', ') + '</div>';
    kit.fixed.forEach(function (it, ti) { if (it.charAt(0) === '@') kh += picker(it, 'f.' + ti); });
    $('kit').innerHTML = kh;
    // spells
    var sc = c.cls.spell, sp = '';
    $('spellcard').style.display = sc ? 'block' : 'none';
    if (sc) {
      var CS = X.CLASS_SPELLS[$('cls').value], isHE = $('subrace').value === 'High Elf', castT = Math.min(20, S.base[sc.ability] + bonus[sc.ability]), prepMax = Math.max(1, D.mod(castT) + 1);
      var cl = CS[0].slice(); if (isHE) X.CLASS_SPELLS.Wizard[0].forEach(function (n) { if (cl.indexOf(n) < 0) cl.push(n); });
      var needC = sc.cantrips + (isHE ? 1 : 0);
      function sch(title, list, sel, max, key) { return chips(title, list, sel, max, function () { return false; }).replace(/class="chip/g, 'data-k="' + key + '" class="chip'); }
      sp += sch('Cantrips', cl, S.cantrips, needC, 'cantrips');
      if (sc.known) sp += sch('Level-1 spells known', CS[1], S.known, sc.known, 'known');
      else if (sc.spellbook) { sp += sch('Spellbook (level 1)', CS[1], S.known, sc.spellbook, 'known'); sp += sch('Prepared today', S.known, S.prepared, prepMax, 'prepared'); }
      else { sp += sch('Prepared spells', CS[1], S.prepared, prepMax, 'prepared'); if ($('cls').value === 'Cleric') sp += '<div class="note">Life domain spells always prepared: Bless, Cure Wounds.</div>'; }
      var seen = S.cantrips.concat(S.known, S.prepared).filter(function (n, i, a) { return a.indexOf(n) === i; });
      if (seen.length) sp += '<div class="sp">' + seen.map(function (n) { var s = X.SPELLS[n]; return '<b>' + n + '</b> (' + (s.level ? 'level 1' : 'cantrip') + ', ' + s.school + ', ' + s.time + ', ' + s.range + '): ' + s.text; }).join('<br>') + '</div>';
      S._max = { cantrips: needC, known: sc.known || sc.spellbook || 0, prepared: prepMax };
    }
    $('spellblocks').innerHTML = sp;
    sheet();
  }
  function D_cls() { return $('cls').value; }
  function details() { var o = {}; ['alignment', 'deity', 'gender', 'age', 'height', 'weight', 'eyes', 'skin', 'hair', 'appearance', 'personality', 'ideals', 'bonds', 'flaws', 'backstory', 'allies', 'treasure', 'notes', 'xp'].forEach(function (k) { o[k] = $('d_' + k).value; }); if (o.alignment === '(unaligned)') o.alignment = ''; return o; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function sheet() {
    var r = D.buildCharacter({ name: $('name').value, race: $('race').value, subrace: $('subrace').disabled ? null : $('subrace').value, cls: $('cls').value, background: $('bg').value, method: S.method, base: S.base, skills: S.skills, bgSkills: S.bgSkills, raceSkills: S.raceSkills, halfElfAsi: S.halfElfAsi, expertise: S.expertise, kit: S.kit, spells: { cantrips: S.cantrips, known: S.known, prepared: S.prepared }, details: details(), gp: $('gp').value, fightingStyle: S.style, dragon: S.dragon });
    S.last = r;
    if (!r.ok) { $('errs').innerHTML = r.errors.map(function (e) { return '<div class="err">' + e + '</div>'; }).join(''); $('sheet').innerHTML = ''; return; }
    $('errs').innerHTML = '<div class="ok">Ready - this character is legal.</div>';
    var s = r.sheet, A = D.ABILITIES;
    $('sheet').innerHTML = '<h3>' + (s.name || 'Unnamed') + '</h3><div class="sub">' + (s.subrace || s.race) + ' ' + s.cls + ' - ' + s.background + ', level 1</div>' +
      '<div class="stats"><div class="st"><b>' + s.hp + '</b><span>HP (' + s.hitDie + ')</span></div><div class="st"><b>' + s.ac + '</b><span>AC (' + s.acNote + ')</span></div><div class="st"><b>' + D.signed(s.initiative) + '</b><span>Initiative</span></div><div class="st"><b>' + s.speed + '</b><span>Speed ft</span></div></div>' +
      '<div class="stats">' + A.map(function (a) { return '<div class="st"><b>' + s.scores[a] + '</b><span>' + a.toUpperCase() + ' ' + D.signed(s.mods[a]) + '</span></div>'; }).join('') + '</div>' +
      '<div class="note">Proficiency ' + D.signed(s.profBonus) + ' - Passive Perception ' + s.passivePerception + ' - ' + s.size + '</div>' +
      '<h2 style="margin-top:12px">Saving throws</h2><table>' + A.map(function (a) { return '<tr><td class="' + (s.saves[a].proficient ? 'pf' : '') + '">' + (s.saves[a].proficient ? '&#9679; ' : '&#9675; ') + D.ABILITY_NAMES[a] + '</td><td class="n">' + D.signed(s.saves[a].bonus) + '</td></tr>'; }).join('') + '</table>' +
      '<h2 style="margin-top:12px">Skills</h2><table>' + D.ALL_SKILLS.map(function (k) { var x = s.skills[k]; return '<tr><td class="' + (x.proficient ? 'pf' : '') + '">' + (x.expertise ? '&#9670; ' : x.proficient ? '&#9679; ' : '&#9675; ') + k + ' <span class="note">(' + x.ability + ')</span></td><td class="n">' + D.signed(x.bonus) + '</td></tr>'; }).join('') + '</table>' +
      (s.spellcasting ? '<h2 style="margin-top:12px">Spellcasting</h2><div class="note">' + s.spellcasting.ability.toUpperCase() + ' - Save DC ' + s.spellcasting.saveDC + ' - Attack ' + D.signed(s.spellcasting.attackBonus) + ' - ' + s.spellcasting.cantrips + ' cantrips - ' + s.spellcasting.slots[1] + ' level-1 slot' + (s.spellcasting.slots[1] > 1 ? 's' : '') + (s.spellcasting.spellsKnown ? ' - ' + s.spellcasting.spellsKnown + ' spells known' : '') + (s.spellcasting.spellbook ? ' - spellbook of ' + s.spellcasting.spellbook : '') + (s.spellcasting.prepared ? ' - prepare ' + s.spellcasting.prepared : '') + '</div>' : '') +
      '<h2 style="margin-top:12px">Features &amp; traits</h2><ul>' + s.features.map(function (f) { return '<li>' + f + '</li>'; }).join('') + '</ul>' +
      '<h2 style="margin-top:12px">Training</h2><div class="note">Armor: ' + (s.armor.join(', ') || 'none') + '<br>Weapons: ' + s.weapons.join(', ') + '<br>Languages: ' + s.languages.join(', ') + '</div>' + extra(s);
  }
  function extra(s) {
    var o = '<h2 style="margin-top:12px">Attacks</h2><table>' + s.attacks.map(function (a) { return '<tr><td>' + a.name + ' <span class="note">' + (a.props.join(', ') || '') + (a.versatile ? ' (two-handed ' + a.versatile + ')' : '') + (a.proficient ? '' : ' - not proficient') + '</span></td><td class="n">' + D.signed(a.bonus) + '</td><td class="n" style="width:110px">' + (/^\d+$/.test(a.dice) ? Math.max(0, +a.dice + a.mod) : a.dice + (a.mod ? D.signed(a.mod) : '')) + ' ' + a.type.slice(0, 5) + '.</td></tr>'; }).join('') + '</table>';
    if (s.stealthDisadvantage) o += '<div class="note">Armor gives disadvantage on Stealth checks.</div>'; if (s.armorWarning) o += '<div class="err">' + s.armorWarning + '</div>';
    o += '<h2 style="margin-top:12px">Equipment</h2><ul>' + s.inventory.map(function (x) { return '<li>' + esc(x.name) + (x.qty > 1 ? ' x' + x.qty : '') + '</li>'; }).join('') + '</ul>';
    s.gear.forEach(function (g) { o += '<details><summary>' + g.pack + ' contents</summary><div class="note">' + g.contents.join(', ') + '</div></details>'; });
    o += '<div class="note">Coins: ' + s.currency.gp + ' gp</div>';
    if (s.spellcasting) { var sc = s.spellcasting, lst = function (t, a) { return a && a.length ? '<div><b>' + t + ':</b> ' + a.join(', ') + '</div>' : ''; };
      o += '<div style="margin-top:8px" class="note">' + lst('Cantrips', sc.cantripList) + lst(sc.spellbook ? 'Spellbook' : 'Spells known', sc.spellbook || sc.spellsKnown ? sc.knownSpells : null) + lst('Prepared', sc.prepared ? sc.preparedSpells : null) + lst('Domain (always prepared)', sc.domainSpells) + '</div>'; }
    var d = s.details, bits = [['Alignment', d.alignment], ['Deity', d.deity], ['Age', d.age], ['Height', d.height], ['Weight', d.weight], ['Eyes', d.eyes], ['Skin', d.skin], ['Hair', d.hair], ['Gender', d.gender], ['XP', d.xp]].filter(function (b) { return b[1]; });
    if (bits.length) o += '<h2 style="margin-top:12px">Details</h2><div class="note">' + bits.map(function (b) { return b[0] + ': ' + esc(b[1]); }).join(' - ') + '</div>';
    [['Appearance', 'appearance'], ['Personality traits', 'personality'], ['Ideals', 'ideals'], ['Bonds', 'bonds'], ['Flaws', 'flaws'], ['Backstory', 'backstory'], ['Allies & organizations', 'allies'], ['Treasure', 'treasure'], ['Notes', 'notes']].forEach(function (p) { if (d[p[1]]) o += '<h2 style="margin-top:12px">' + p[0] + '</h2><div class="tw">' + esc(d[p[1]]) + '</div>'; });
    o += '<h2 style="margin-top:12px">Tracking</h2><div class="note">Inspiration &#9744; - Hit dice ' + s.hitDiceTotal + ' - Death saves: successes &#9675;&#9675;&#9675; failures &#9675;&#9675;&#9675; - Temp HP ____ - Conditions ____</div>';
    return o;
  }
  // events
  ['race', 'subrace', 'cls', 'bg'].forEach(function (id) { $(id).onchange = function () { S.skills = []; S.bgSkills = []; S.raceSkills = []; S.expertise = []; if (id === 'cls' || id === 'subrace') { S.kit = { choices: [], picks: {} }; S.cantrips = []; S.known = []; S.prepared = []; } if (id === 'race') S.halfElfAsi = []; render(); }; });
  $('name').oninput = sheet; $('gp').oninput = sheet; Array.prototype.forEach.call(document.querySelectorAll('[id^=d_]'), function (e) { e.oninput = sheet; e.onchange = sheet; }); $('reroll').onclick = function () { setMethod('roll'); };
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.a) { var a = t.dataset.a, n = S.base[a] + (+t.dataset.d); if (n >= 8 && n <= 15) { S.base[a] = n; if (D.pointCost(S.base) > D.POINT_BUDGET) S.base[a] -= +t.dataset.d; } render(); }
    else if (t.dataset && t.dataset.k) { var c = current(), mx = { skills: c.cls.skillCount, bgSkills: c.bg.pick || 0, raceSkills: c.race.skillsChoose || 0, halfElfAsi: 2, expertise: c.cls.expertise || 0, cantrips: (S._max || {}).cantrips || 0, known: (S._max || {}).known || 0, prepared: (S._max || {}).prepared || 0 }; if (!t.classList.contains('off')) { toggle(S[t.dataset.k], t.dataset.s, mx[t.dataset.k]); if (t.dataset.k === 'known') S.prepared = S.prepared.filter(function (n) { return !c.cls.spell.spellbook || S.known.indexOf(n) >= 0; }); if (['skills', 'bgSkills', 'raceSkills'].indexOf(t.dataset.k) >= 0) S.expertise = S.expertise.filter(function (s) { return [].concat(c.race.skills, c.bg.skills, S.skills, S.bgSkills, S.raceSkills).indexOf(s) >= 0; }); render(); } }
  });
  document.addEventListener('change', function (e) { var t = e.target; if (t.dataset && t.dataset.sel) { S[t.dataset.sel] = t.value; render(); return; } if (t.dataset && t.dataset.kit !== undefined) { S.kit.choices[+t.dataset.kit] = t.value === '' ? undefined : +t.value; Object.keys(S.kit.picks).forEach(function (k) { if (k.split('.')[0] === t.dataset.kit) delete S.kit.picks[k]; }); render(); } if (t.dataset && t.dataset.pick) { S.kit.picks[t.dataset.pick] = t.value; render(); } if (t.dataset && t.dataset.sa) { S.base[t.dataset.sa] = +t.value; render(); } if (t.dataset && t.dataset.na) { S.base[t.dataset.na] = Math.max(3, Math.min(20, +t.value || 10)); render(); } });
  function load() { try { return JSON.parse(localStorage.getItem('dnd.characters') || '[]'); } catch (e) { return []; } }
  function listSaved() { var l = load(); $('saved').innerHTML = l.length ? l.map(function (c, i) { return '<div>' + c.name + ' - ' + (c.subrace || c.race) + ' ' + c.cls + ' <a href="#" data-del="' + i + '" style="color:var(--bad)">delete</a></div>'; }).join('') : 'Nothing saved yet.'; }
