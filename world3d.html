<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Myosia in 3D</title>
<style>
html,body{margin:0;height:100%;background:#0e1318;color:#e8ecef;font:14px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:fixed;left:12px;top:12px;max-width:300px;background:rgba(14,19,24,.78);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 12px;line-height:1.45}
#hud h1{margin:0 0 4px;font-size:16px}
#hud .k{opacity:.7;font-size:12px}
#hud label{display:block;margin-top:6px;font-size:12px}
#hud input[type=range]{width:100%}
#hud select{background:#1b242c;color:#e8ecef;border:1px solid rgba(255,255,255,.25);border-radius:5px;font-size:12px;padding:1px 4px}
#hud a{color:#9cc7ff}
#info{position:fixed;right:12px;top:12px;background:rgba(14,19,24,.78);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;text-align:right;min-width:150px}
#mini{position:fixed;left:12px;bottom:12px;width:300px;border:1px solid rgba(255,255,255,.3);border-radius:6px;cursor:crosshair;background:#000}
#mini canvas{position:static;width:100%;height:auto;cursor:crosshair}
#mdot{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#ffd34d;border:2px solid #000;pointer-events:none}
.lb{position:fixed;transform:translate(-50%,-100%);pointer-events:none;font:12px/1 Georgia,serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000;white-space:nowrap;display:none}
.lb.cap{font-weight:700;font-size:13px;color:#ffe9a8}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1318;font-size:16px;z-index:5;text-align:center;padding:20px}
@media(max-width:700px){#hud{max-width:200px;font-size:12px}#mini{width:200px}}
</style></head><body>
<canvas id="gl"></canvas>
<div id="msg">Loading the world…</div>
<div id="hud"><h1 id="ttl">Myosia in 3D</h1>
<div class="k">Drag to look · W A S D to fly · Q / E down / up · Shift to go faster · mouse wheel changes speed · click the small map to jump</div>
<label>Time of day <span id="tdv">10:30</span><input id="td" type="range" min="0" max="24" step="0.05" value="10.5"></label>
<label>Mountain height ×<span id="exv">25</span><input id="ex" type="range" min="1" max="120" value="25"></label>
<label>Quality <select id="qs"><option>High</option><option>Medium</option><option>Low</option></select></label>
<label><input id="lbt" type="checkbox" checked> City names</label>
<label><input id="bio" type="checkbox" checked> Biome colours (instead of height colours)</label>
<div class="k" style="margin-top:6px"><a href="map.html">← 2D map</a> · <a href="index.html">Chess</a></div></div>
<div id="info"><div id="place" style="font-weight:600">—</div><div class="k" id="alt"></div><div class="k" id="pos"></div><div class="k" id="fps"></div></div>
<div id="mini"><canvas id="mc"></canvas><div id="mdot"></div></div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('gl');
  var gl = cv.getContext('webgl', { antialias: true, powerPreference: 'high-performance', alpha: false });
  var msg = document.getElementById('msg');
  if (!gl) { msg.textContent = 'This browser cannot do WebGL, so the 3D view will not run here.'; return; }

  Promise.all([loadImg('world3d-height.png'), loadImg('world3d-color.png'), fetch('world3d-places.json').then(function (r) { return r.json(); }), loadImg('world3d-mask.png'), loadImg('world3d-biome.png')])
    .then(function (a) { start(a[0], a[1], a[2], a[3], a[4]); })
    .catch(function (e) { msg.textContent = 'Could not load ' + (e && e.message ? e.message : e) + '. Make sure world3d-height.png, world3d-color.png, world3d-mask.png, world3d-biome.png and world3d-places.json are in the same folder as this page.'; console.error(e); });

  function start(himg, cimg, meta, mimg, bimg) {
    var W = meta.w, H = meta.h, MI = meta.mi, EXP = meta.exp;
    var FTPX = 5280 * MI;                      // feet per map pixel
    var FT = 1 / FTPX;                         // one foot in map pixels
    document.getElementById('ttl').textContent = meta.name + ' in 3D';
    // ---------- required GL features ----------
    if (!gl.getExtension('OES_element_index_uint')) { msg.textContent = 'This browser is missing a 3D feature (32-bit indices) needed for the full-size world.'; return; }
    if (gl.getParameter(gl.MAX_VERTEX_TEXTURE_IMAGE_UNITS) < 2) { msg.textContent = 'This graphics card cannot read textures in the vertex stage, which the terrain needs.'; return; }
    var VX = gl.getExtension('ANGLE_instanced_arrays');
    var QS = { q: 'High' };
    try { QS.q = localStorage.getItem('myosia3d.q') || 'High'; } catch (e) { }
    if (['High', 'Medium', 'Low'].indexOf(QS.q) < 0) QS.q = 'High';

    // ---------- decode the data images ----------
    function pixels(img, w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; var x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0, w, h); return x.getImageData(0, 0, w, h).data; }
    var HP = pixels(himg, W, H);
    var MW = mimg.width, MH = mimg.height, SC = MW / W;
    var MD = pixels(mimg, MW, MH);
    var BD = pixels(bimg, W, H);
    var CDATA = pixels(cimg, W, H);
    var n = W * H, i, LF = new Uint8Array(n), Y = new Float32Array(n);

    var SD = new Float32Array(n), BIG = 1e4, zi, xi;

    for (zi = 0; zi < H; zi++) for (xi = 0; xi < W; xi++) { var o = zi * W + xi, v = SD[o]; if (v === 0) continue;
      if (xi > 0) v = Math.min(v, SD[o - 1] + 1); if (zi > 0) { v = Math.min(v, SD[o - W] + 1); if (xi > 0) v = Math.min(v, SD[o - W - 1] + 1.4142); if (xi < W - 1) v = Math.min(v, SD[o - W + 1] + 1.4142); } SD[o] = v; }
    for (zi = H - 1; zi >= 0; zi--) for (xi = W - 1; xi >= 0; xi--) { var o2 = zi * W + xi, v2 = SD[o2]; if (v2 === 0) continue;
      if (xi < W - 1) v2 = Math.min(v2, SD[o2 + 1] + 1); if (zi < H - 1) { v2 = Math.min(v2, SD[o2 + W] + 1); if (xi < W - 1) v2 = Math.min(v2, SD[o2 + W + 1] + 1.4142); if (xi > 0) v2 = Math.min(v2, SD[o2 + W - 1] + 1.4142); } SD[o2] = v2; }
    var SDT = new Uint8Array(n * 4);
    for (i = 0; i < n; i++) { var dv = Math.min(SD[i], 63) / 63 * 255 + 0.5; SDT[i * 4] = dv; SDT[i * 4 + 1] = dv; SDT[i * 4 + 2] = dv; SDT[i * 4 + 3] = 255; }

    // ---------- noise lattice (shared bit-for-bit by the GPU and the CPU ground function) ----------
    function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

      var ix = Math.floor(px), iz = Math.floor(pz), fx = px - ix, fz = pz - iz;

        for (y = 0; y < P; y++) for (x = 0; x < P; x++) {

          for (oc = 0; oc < 6; oc++) {

            var a = gg[j0 * pp2 + i0], b = gg[j0 * pp2 + i1], c = gg[j1 * pp2 + i0], d = gg[j1 * pp2 + i1];

      }
    })();

    // ---------- the ground function (identical maths to the GPU vertex shader) ----------

    var NOCT = 12, OCT = [], k;
    for (k = 0; k < NOCT; k++) { var lam = 2 * Math.pow(2.5, -k), ang = k * 0.83 + 0.4; OCT.push({ lam: lam, a: 0.04 * Math.pow(0.45, k), c: Math.cos(ang), s: Math.sin(ang), ox: (k * 37.31) % 256, oz: (k * 11.17) % 256 }); }
    function sstep(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
    function cellSize(l) { return Math.pow(2, l - 10); }

    function octWeights(cell) { var w = []; for (var k2 = 0; k2 < NOCT; k2++) w.push(sstep(3.5, 7.0, OCT[k2].lam / cell)); return w; }
    var W0 = octWeights(cellSize(0));
    function baseAtC(x, z) {                   // returns [baseHeight, landFraction]
      var x0 = Math.floor(x), z0 = Math.floor(z), fx = x - x0, fz = z - z0;
      var xa = Math.max(0, Math.min(W - 1, x0)), xb = Math.max(0, Math.min(W - 1, x0 + 1)), za = Math.max(0, Math.min(H - 1, z0)), zb = Math.max(0, Math.min(H - 1, z0 + 1));
      var ya = Y[za * W + xa], yb = Y[za * W + xb], yc = Y[zb * W + xa], yd = Y[zb * W + xb];
      var la = LF[za * W + xa], lb = LF[za * W + xb], lc = LF[zb * W + xa], ld = LF[zb * W + xb];

      var bl = baseAtC(x, z), by = bl[0]; if (bl[1] <= 0.5) return 0;
      var lf = sstep(0.0003, 0.0025, by), rough = Math.max(0.2, Math.min(1, 0.2 + (Math.sqrt(by * FTPX) - 2) / 50)), det = 0;
      for (var k2 = 0; k2 < NOCT; k2++) {

    }
    function groundAt(x, z) { x = Math.max(0, Math.min(W - 1, x)); z = Math.max(0, Math.min(H - 1, z)); return hgtC(x, z, W0); }
    function baseAt(x, z) { return baseAtC(Math.max(0, Math.min(W - 1.0001, x)), Math.max(0, Math.min(H - 1.0001, z)))[0]; }
    function landAt(x, z) { return baseAtC(Math.max(0, Math.min(W - 1.0001, x)), Math.max(0, Math.min(H - 1.0001, z)))[1] > 0.5; }
    function landSafe(x, z) { return landAt(x, z) && landAt(x + 0.6, z) && landAt(x - 0.6, z) && landAt(x, z + 0.6) && landAt(x, z - 0.6); }
    function hG(x, z) { var by = baseAt(x, z); return by > 0 ? 18 + Math.sqrt(by * FTPX) : 0; }   // map height value (0..100 scale)

    function biomeInfo(x, z) {

      if (attribs) attribs.forEach(function (nm, i) { gl.bindAttribLocation(p, i, nm); });
      gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));

    var cam = { x: W * 0.5, y: 330, z: H * 0.75, yaw: 0, pitch: -0.75 };

      'vec3 skyCol(vec3 rd){float up=clamp(rd.y,0.0,1.0);float hz=pow(1.0-up,4.0);vec3 c=mix(uSkyTop,uSkyHor,hz);float sd=max(dot(rd,uSun),0.0);float low=1.0-smoothstep(0.0,0.5,abs(uSun.y));' +
      'c+=uSunCol*(pow(sd,8.0)*(0.03+0.14*low)+pow(sd,180.0)*0.25);return c;}\n' +
      'vec3 tonemap(vec3 x){x*=uExp;x=(x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14);return pow(clamp(x,0.0,1.0),vec3(0.4545));}\n' +
      'vec3 fogColAt(vec3 rd){vec3 h=vec3(rd.x,0.0,rd.z);float l=length(h);h=l>1e-4?h/l:vec3(1.0,0.0,0.0);return skyCol(vec3(h.x,0.02,h.z)*0.9995);}\n';

      'float unpackD(vec4 c){return dot(c,vec4(1.0,1.0/255.0,1.0/65025.0,1.0/16581375.0));}\n' +
      'float shadowAt(vec3 rel,float bias){if(uShP.x<=0.0)return 1.0;vec4 lp=uLVP*vec4(rel,1.0);vec3 sc=lp.xyz*0.5+0.5;' +
      'float edge=smoothstep(0.0,0.12,min(min(sc.x,1.0-sc.x),min(sc.y,1.0-sc.y)));if(edge<=0.0||sc.z>=1.0)return 1.0;' +
      'float ts=uShP.y,z=sc.z-bias*uShP.z;float s=0.0;' +
      's+=step(z,unpackD(texture2D(uSh,sc.xy+vec2(-0.7,-0.4)*ts)));s+=step(z,unpackD(texture2D(uSh,sc.xy+vec2(0.4,-0.7)*ts)));' +

    })();

    // ================= program setup that never changes =================
    [PC, PK].forEach(function (p) {

    gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
    var GALX = 257.1, GALZ = 851.2;
    var FOV = 1.0, perfT = 0, speed = 1, keys = {}, EXV = document.getElementById('exv');
    // ================= input =================
    var drag = false, lx = 0, ly = 0;
    cv.addEventListener('pointerdown', function (e) { drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointerup', function () { drag = false; });
    cv.addEventListener('pointermove', function (e) { if (!drag) return; cam.yaw -= (e.clientX - lx) * 0.004; cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch - (e.clientY - ly) * 0.004)); lx = e.clientX; ly = e.clientY; });
    cv.addEventListener('wheel', function (e) { e.preventDefault(); speed = Math.max(0.1, Math.min(30, speed * (e.deltaY < 0 ? 1.2 : 1 / 1.2))); }, { passive: false });
    window.addEventListener('keydown', function (e) { if (/INPUT|SELECT/.test(e.target.tagName)) return; keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
    var exEl = document.getElementById('ex');
    exEl.addEventListener('input', function () { EX = +exEl.value; EXV.textContent = EX; });
    var lbt = document.getElementById('lbt'), bioEl = document.getElementById('bio'), qsEl = document.getElementById('qs');
    qsEl.value = QS.q;
    qsEl.addEventListener('change', function () { QS.q = qsEl.value; try { localStorage.setItem('myosia3d.q', QS.q); } catch (e) { } ensureShadow(); });
    ensureShadow();
    // ================= minimap =================
    var mc = document.getElementById('mc'); mc.width = 300; mc.height = Math.round(300 * H / W);
    mc.getContext('2d').drawImage(cimg, 0, 0, mc.width, mc.height);
    var mdot = document.getElementById('mdot'), mini = document.getElementById('mini');
    function tele(e) { var r = mc.getBoundingClientRect(); cam.x = (e.clientX - r.left) / r.width * W; cam.z = (e.clientY - r.top) / r.height * H; cam.y = Math.max(cam.y, groundAt(cam.x, cam.z) + 20); }
    mini.addEventListener('pointerdown', function (e) { tele(e); mini.setPointerCapture(e.pointerId); mini._d = true; });
    mini.addEventListener('pointermove', function (e) { if (mini._d) tele(e); }); mini.addEventListener('pointerup', function () { mini._d = false; });
    // ================= labels =================
    var P = meta.places, pool = [], LB = 70;
    for (i = 0; i < LB; i++) { var el = document.createElement('div'); el.className = 'lb'; document.body.appendChild(el); pool.push(el); }
    var placeEl = document.getElementById('place'), altEl = document.getElementById('alt'), posEl = document.getElementById('pos'), fpsEl = document.getElementById('fps');
    function labels(vp, w, hh, alt) {
      if (!lbt.checked) { pool.forEach(function (e) { e.style.display = 'none'; }); return; }
      var used = {}, cnt = 0, minPop = alt > 200 ? 30000 : alt > 80 ? 8000 : alt > 25 ? 2500 : 0;
      for (var j = 0; j < P.length && cnt < LB; j++) {
        var p = P[j]; if (!p.cap && p.pop < minPop) continue;
        var rx = p.x - cam.x, ry = groundAt(p.x, p.y) - cam.y, rz = p.y - cam.z;
        var cx = vp[0] * rx + vp[4] * ry + vp[8] * rz, cy = vp[1] * rx + vp[5] * ry + vp[9] * rz, cw = vp[3] * rx + vp[7] * ry + vp[11] * rz;
        if (cw <= 0.0001) continue; var sx = (cx / cw * 0.5 + 0.5) * w, sy = (1 - (cy / cw * 0.5 + 0.5)) * hh;
        if (sx < 0 || sx > w || sy < 20 || sy > hh) continue;
        var key = ((sx / 90) | 0) + ',' + ((sy / 24) | 0); if (used[key]) continue; used[key] = 1;
        var e = pool[cnt++]; e.style.display = 'block'; e.className = 'lb' + (p.cap ? ' cap' : ''); e.textContent = p.n; e.style.left = sx + 'px'; e.style.top = sy + 'px';
      }
      for (; cnt < LB; cnt++) pool[cnt].style.display = 'none';
    }
    function nearest() { var best = null, bd = 1e9; for (var j = 0; j < P.length; j++) { var dx = P[j].x - cam.x, dz = P[j].y - cam.z, q = dx * dx + dz * dz; if (q < bd) { bd = q; best = P[j]; } } return bd < 900 ? best : null; }
    // ================= terrain drawing =================

    function ringFor(l, st) { return l === 0 ? IDX.full : IDX[HOLE_OFF[st.hx + ',' + st.hz]]; }
    function shadowBindForTerrain(p) { setShadowUniforms(p); }
    function drawClipLevels(prog, lmax, mainPass) {
      gl.bindBuffer(gl.ARRAY_BUFFER, bIJ); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        var st = levelState(l); setLevelUniforms(prog, l, st);

          gl.uniform2f(prog.u.uFO0, modT(st.ox * FTPX, 16384), modT(st.oz * FTPX, 16384));
          gl.uniform2f(prog.u.uFO1, modT(st.ox * FTPX, 2048), modT(st.oz * FTPX, 2048));
          gl.uniform2f(prog.u.uFO2, modT(st.ox * FTPX, 256), modT(st.oz * FTPX, 256));

      }
      gl.disableVertexAttribArray(0);
    }
    function setFragCommon(p, far, pxK) {
      setAtmoUniforms(p, far); setShadowUniforms(p);
      gl.uniform1f(p.u.uBio, bioEl.checked ? 1 : 0); gl.uniform2f(p.u.uGal, GALX, GALZ); gl.uniform1f(p.u.uPxK, pxK);
    }
    // ================= main loop =================
    var last = performance.now(), frame = 0, fpsAcc = 0, fpsN = 0, fpsT = performance.now();
    function loop(t) {
      perfT = t / 1000;
      var dt = Math.min(0.1, (t - last) / 1000), rawDt = (t - last) / 1000; last = t;
      var gnd = groundAt(cam.x, cam.z), alt = Math.max(0.0004, cam.y - gnd);
      var v = Math.max(alt, 0.0015) * 1.6 * speed * (keys.shift ? 4 : 1) * dt, f = fwd(), r = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
      if (keys.w || keys.arrowup) { cam.x += f[0] * v; cam.y += f[1] * v; cam.z += f[2] * v; }
      if (keys.s || keys.arrowdown) { cam.x -= f[0] * v; cam.y -= f[1] * v; cam.z -= f[2] * v; }
      if (keys.d || keys.arrowright) { cam.x += r[0] * v; cam.z += r[2] * v; }
      if (keys.a || keys.arrowleft) { cam.x -= r[0] * v; cam.z -= r[2] * v; }
      if (keys.e || keys[' ']) cam.y += v; if (keys.q || keys.c) cam.y -= v;
      cam.x = Math.max(0, Math.min(W - 1, cam.x)); cam.z = Math.max(0, Math.min(H - 1, cam.z));
      gnd = groundAt(cam.x, cam.z); if (cam.y < gnd + 0.0004) cam.y = gnd + 0.0004; if (cam.y > 1500) cam.y = 1500;
      alt = Math.max(0.0004, cam.y - gnd);
      var dprCap = QS.q === 'High' ? 2 : QS.q === 'Medium' ? 1.25 : 1, dpr = Math.min(window.devicePixelRatio || 1, dprCap), w = cv.clientWidth, hh = cv.clientHeight;
      if (cv.width !== (w * dpr | 0) || cv.height !== (hh * dpr | 0)) { cv.width = w * dpr | 0; cv.height = hh * dpr | 0; }
      var asp = cv.width / cv.height, near = Math.max(alt * 0.05, 0.00002), far = Math.min(6000, Math.max(alt * 600, 40)), pxK = cv.height / 900;
      var proj = persp(FOV, asp, near, far), vpRot = mul(proj, viewRot());

        gl.bindFramebuffer(gl.FRAMEBUFFER, SHD.fbo); gl.viewport(0, 0, SHD.size, SHD.size); gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.disable(gl.CULL_FACE); gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 4);
        var lmax = 0; while (lmax < 8 && 32 * cellSize(lmax) < 2.2 * SHD.S) lmax++;
        gl.useProgram(PCS); gl.uniformMatrix4fv(PCS.u.uVP, false, SHD.lvp); drawClipLevels(PCS, lmax, false);
        if (VEG) VEG.drawShadow(SHD.lvp, t);
        gl.disable(gl.POLYGON_OFFSET_FILL); gl.enable(gl.CULL_FACE); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        var texW = 2 * SHD.S / SHD.size, D = SHD.S * 4 + 0.01; SHD.bias = 1.6 * texW / (2 * D);
      }
      // ---- main pass ----
      gl.viewport(0, 0, cv.width, cv.height); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      drawSky(asp, far);
      bindWorldTex(); bindTex(6, SHD.tex);
      // coarse world beyond the clip region
      var st11 = levelState(NLEV - 1), hr0 = 32 * st11.s;
      gl.useProgram(PK); gl.uniformMatrix4fv(PK.u.uVP, false, vpRot); gl.uniform1f(PK.u.uEx, EX); gl.uniform3f(PK.u.uCam, cam.x, cam.y, cam.z);
      setFragCommon(PK, far, pxK); gl.uniform2f(PK.u.uFO0, 0, 0); gl.uniform2f(PK.u.uFO1, 0, 0); gl.uniform2f(PK.u.uFO2, 0, 0); gl.uniform4f(PK.u.uHole, st11.ox - hr0 + 1.0, st11.oz - hr0 + 1.0, st11.ox + hr0 - 1.0, st11.oz + hr0 - 1.0);

      gl.bindBuffer(gl.ARRAY_BUFFER, bKD); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bKI); gl.drawElements(gl.TRIANGLES, kidx.length, gl.UNSIGNED_INT, 0);
      gl.disableVertexAttribArray(0); gl.disableVertexAttribArray(1); gl.disable(gl.POLYGON_OFFSET_FILL);

      gl.useProgram(PC); gl.uniformMatrix4fv(PC.u.uVP, false, vpRot); setFragCommon(PC, far, pxK);
      drawClipLevels(PC, NLEV - 1, true);
      if (VEG) VEG.draw(vpRot, far, t);
      drawIslands(vpRot, far);

      if ((frame++ & 1) === 0) {
        labels(vpRot, w, hh, alt);
        mdot.style.left = cam.x / W * 100 + '%'; mdot.style.top = cam.z / H * 100 + '%';
        var nb = nearest(); placeEl.textContent = nb ? nb.n + (nb.s ? ' · ' + nb.s : '') : '—';
        var miAlt = alt * MI; altEl.textContent = 'Altitude ' + (miAlt >= 1 ? miAlt.toFixed(1) + ' mi' : Math.round(miAlt * 5280) + ' ft') + ' above ground';
        posEl.textContent = Math.round(cam.x * MI) + ', ' + Math.round(cam.z * MI) + ' mi from the NW corner';
      }

    }

  }
})();
